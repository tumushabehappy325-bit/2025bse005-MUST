<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | MUST Online Application Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="hero__logo" src="../logo.png" alt="MUST crest">
      <h1 class="hero__title">Mbarara University of Science and Technology</h1>
      <span class="pill">Online Application Portal</span>
    </header>

    <main class="card">
      <div class="card__body">
        <h2>Welcome Back</h2>
        <p class="card__sub">Log in to access your application dashboard</p>
        <form>
          <div class="field"><label for="email">Email Address</label><div class="input"><span class="input__icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span><input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="username"></div></div>
          <div class="field"><label for="password">Password</label><div class="input"><span class="input__icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div>
          <a class="btn btn--primary btn--block" href="application.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Sign In</a>
        </form>
        <a class="forgot" href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> Forgot your password?</a>
        <div class="divider">New to the portal?</div>
        <div class="pair">
          <a class="btn btn--outline" href="signup.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg> Create Account</a>
          <a class="btn btn--gray" href="how-to-apply.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> How to Apply</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
