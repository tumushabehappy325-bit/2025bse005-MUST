<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | MUST Online Application Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="hero__logo" src="../logo.png" alt="MUST crest">
      <h1 class="hero__title">Mbarara University of Science and Technology</h1>
      <span class="pill">Online Application Portal</span>
    </header>

    <main class="card">
      <div class="card__body">
        <h2>Welcome Back</h2>
        <p class="card__sub">Log in to access your application dashboard</p>
        <form>
          <div class="field"><label for="email">Email Address</label><div class="input"><input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="username"></div></div>
          <div class="field"><label for="password">Password</label><div class="input"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password"></div></div>
          <a class="btn btn--primary btn--block" href="application.html">Sign In</a>
        </form>
        <a class="forgot" href="#">Forgot your password?</a>
        <div class="divider">New to the portal?</div>
        <div class="pair">
          <a class="btn btn--outline" href="signup.html">Create Account</a>
          <a class="btn btn--gray" href="how-to-apply.html">How to Apply</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
