<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | MUST Online Application Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <img class="hero__logo" src="../logo.png" alt="MUST crest">
      <h1 class="hero__title">Mbarara University of Science and Technology</h1>
      <span class="pill">Online Application Portal</span>
    </header>

    <main class="card">
      <div class="card__head">
        <div>
          <h2>Create Account</h2>
          <p class="card__sub">Provide your details to receive a temporary password.</p>
        </div>
        <a class="close-x" href="login.html" aria-label="Close">×</a>
      </div>
      <form>
        <div class="card__body">
          <div class="field"><label for="surname">Surname</label><div class="input"><input id="surname" name="surname" type="text" placeholder="Surname" autocomplete="family-name"></div></div>
          <div class="field"><label for="other">Other Names</label><div class="input"><input id="other" name="other" type="text" placeholder="Other names" autocomplete="given-name"></div></div>
          <div class="field">
            <label for="email">Email Address</label><div class="input"><input id="email" name="email" type="email" placeholder="myemail@gmail.com" autocomplete="email"></div>
          </div>
          <a class="right-link" href="https://accounts.google.com/signup" target="_blank" rel="noopener">Don't have an Email? Click to create</a>
        </div>
        <div class="card__foot">
          <a class="btn btn--gray" href="login.html">Close</a>
          <a class="btn btn--blue" href="login.html">Create Account</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
